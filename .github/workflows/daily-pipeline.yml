name: Daily ATS Pipeline

on:
  schedule:
    # Safety check at 11:30 AM ET (Mon-Fri) = 16:30 UTC (EST) / 15:30 UTC (EDT)
    # Runs after local 9:15 AM pipeline + 10:30 AM retry task have completed
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Leave empty for today.'
        required: false
        type: string
      skip_pull:
        description: 'Skip data pull (only re-encrypt and deploy existing data)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check if local pipeline deployed today
        id: check_deployed
        run: |
          # Check last commit on data.enc and venue-overview.enc
          # If both were updated today, local pipeline succeeded
          DATA_DATE=$(git log -1 --format=%cd --date=short -- data.enc 2>/dev/null || echo "1970-01-01")
          VENUE_DATE=$(git log -1 --format=%cd --date=short -- venue-overview.enc 2>/dev/null || echo "1970-01-01")
          TODAY=$(date -u +%Y-%m-%d)

          echo "data.enc last update: $DATA_DATE"
          echo "venue-overview.enc last update: $VENUE_DATE"
          echo "Today's date: $TODAY"

          if [ "$DATA_DATE" = "$TODAY" ] && [ "$VENUE_DATE" = "$TODAY" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "✓ Local pipeline successfully deployed today"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Local pipeline may have failed — .enc files not updated today"
          fi

      - name: Alert if local pipeline appears to have failed
        if: steps.check_deployed.outputs.deployed == 'false'
        run: |
          echo "⚠️  ALERT: Local pipeline may not have completed"
          echo ""
          echo "TROUBLESHOOTING:"
          echo "1. Check Windows Task Scheduler on your laptop"
          echo "2. Verify 'Sapinover_Daily_Pipeline' ran at 9:15 AM ET"
          echo "3. Check 'Sapinover_Daily_Retry' ran at 10:30 AM ET"
          echo "4. Verify BOATS/Bruce/Moon files arrived on time"
          echo "5. Manual fix: Run daily_pull_all.py --staggered-pipeline on laptop"
          echo "6. Then manually git push to GitHub Pages"
          echo ""
          exit 1

      - name: Install dependencies (manual fallback only)
        if: github.event_name == 'workflow_dispatch'
        run: pip install -r pipeline/requirements.txt

      - name: Run cloud pipeline (manual fallback only)
        if: github.event_name == 'workflow_dispatch'
        env:
          # Gmail IMAP (for BOATS xlsx download)
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Bruce Markets SFTP
          BRUCE_SFTP_HOST: ${{ secrets.BRUCE_SFTP_HOST }}
          BRUCE_SFTP_PORT: ${{ secrets.BRUCE_SFTP_PORT }}
          BRUCE_SFTP_USER: ${{ secrets.BRUCE_SFTP_USER }}
          BRUCE_SFTP_PASSWORD: ${{ secrets.BRUCE_SFTP_PASSWORD }}
          # Egnyte API (Bruce fallback)
          EGNYTE_DOMAIN: ${{ secrets.EGNYTE_DOMAIN }}
          EGNYTE_ACCESS_TOKEN: ${{ secrets.EGNYTE_ACCESS_TOKEN }}
          # Microsoft Graph API (BOATS fallback)
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_USER_EMAIL: ${{ secrets.GRAPH_USER_EMAIL }}
          # Supabase (pipeline status reporting)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Encryption password
          ENCRYPT_PASSWORD: ${{ secrets.ENCRYPT_PASSWORD }}
          # Pipeline options
          TARGET_DATE: ${{ inputs.date }}
          SKIP_PULL: ${{ inputs.skip_pull }}
        run: |
          cd pipeline
          python cloud_orchestrator.py \
            ${TARGET_DATE:+--date "$TARGET_DATE"} \
            ${SKIP_PULL:+--skip-pull}

      - name: Check for .enc changes (manual fallback only)
        if: github.event_name == 'workflow_dispatch'
        id: check_changes
        run: |
          # Copy encrypted files from pipeline output to repo root
          for f in data.enc venue-overview.enc metrics-guide.enc; do
            if [ -f "pipeline/output/$f" ]; then
              cp "pipeline/output/$f" "./$f"
              echo "Copied $f to repo root"
            fi
          done

          # Check if anything changed
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No .enc file changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in .enc files"
          fi

      - name: Commit and push (manual fallback only)
        if: github.event_name == 'workflow_dispatch' && steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "Sapinover Cloud Backup"
          git config user.email "cloud-backup@sapinover.com"

          DATE_LABEL="${TARGET_DATE:-$(date -u +%Y-%m-%d)}"

          git add data.enc venue-overview.enc metrics-guide.enc
          git commit -m "Cloud backup: auto-deploy data for ${DATE_LABEL}" || true
          git push origin main

      - name: Report success
        if: steps.check_deployed.outputs.deployed == 'true'
        run: |
          echo "✓ Cloud safety check PASSED"
          echo "✓ All .enc files deployed today"
          echo "✓ Local Windows Task Scheduler pipeline completed successfully"

      - name: Upload pipeline logs (manual fallback only)
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: pipeline/logs/
          retention-days: 14
